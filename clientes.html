    <header class="banner">
        <h1>Gestão de Clientes</h1>
        <p>Cadastre e gerencie sua base de contatos</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Novo Cadastro</h2>
            <form action="/salvar-cliente" method="POST">
                <input type="text" name="nome" placeholder="Nome do Cliente" required>
                <input type="text" name="cpf" placeholder="CPF/CNPJ" required>
                <input type="tel" name="telefone" placeholder="Telefone" required>
                <button type="submit">Salvar Cliente</button>
            </form>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h2>Clientes Cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CPF/CNPJ</th>
                        <th>Telefone</th>
                        <th>Ações</th> <!--Coluna de ações adicionada-->           
                    </tr>
                </thead>
                <tbody id="lista-clientes">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function carregarClientes(){
            fetch('/listar-clientes')
                .then(res => res.json())
                .then(clientes => {
                    const corpoTabela = document.getElementById('lista-clientes');
                    corpoTabela.innerHTML = ''; // Limpa a tabela antes de carregar
                    
                    clientes.forEach(c => {
                        corpoTabela.innerHTML += `
                            <tr>
                                <td>${c.nome}</td>
                                <td>${c.cpf}</td>
                                <td>${c.telefone}</td>
                                <td>
                                    <button onclick="editarCliente('${c.cpf}')">Editar</button>
                                    <button onclick="excluirCliente('${c.cpf}')" style="background-color: #ff4d4d; color: white;">Excluir</button>
                                </td>
                            </tr>
                        `;
                    });
                })
                .catch(err => console.error("Erro ao carregar clientes:", err));
        }

        // Funções auxiliares para as ações (Exemplos lógicos)

            console.log("Editar cliente com identificador:", id);
            // Implemente a lógica de edição aqui

            if(confirm("Deseja realmente excluir este cliente?")) {
                console.log("Excluir cliente com identificador:", id);
                // Implemente o fetch DELETE ou POST para exclusão aqui
            }
        }
// Função para colocar dados no form para Editar | Acrescentar tudo
		function prepararEdicao(id,nome,cpf,telefone){
			const form=document.getElementByld('form-cliente');
			form.dataset.id=id;//Guarda o ID no formulário
			form.nome.value=nome;
			form.cpf.value=cpf;
			form.telefone.value=telefone;

			document.getElementByld('titulo-form').innerText="Editar Cadastro";
			const btn = document.getElementByld('btn-salvar');
			btn.innerText="Confirmar Alteração";
			btn.style.background="orange";
		}
		carregarClientes();
	</script>
